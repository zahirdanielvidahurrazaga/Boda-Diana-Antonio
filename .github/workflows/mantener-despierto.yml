# Supabase gratis se pausa tras 7 días sin actividad. Esto consulta la base una
# vez al día para que la galería no se duerma antes de la boda (17-oct-2026).
# La llave es la "anon" pública: la misma que ya va dentro de la página.
name: Mantener Supabase despierto

on:
  schedule:
    - cron: '17 15 * * *'   # diario, 9:17 am hora del centro de México
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
